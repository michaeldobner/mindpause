<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MIND PAUSE</title>
  <meta name="description" content="Calm, beautifully crafted puzzle games for iPhone and iPad. Free, offline, no ads.">
  <meta name="theme-color" content="#ece8e1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141519" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="spring/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shared/tokens.css?shell=1.3.0">
  <style>
    html, body { overflow: auto; height: auto; }
    .home {
      max-width: 760px;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .home-brand {
      margin: 18px 0 6px;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(34px, 9vw, 54px);
      letter-spacing: 0.18em;
    }
    .home-tagline {
      margin: 0 0 30px;
      max-width: 34em;
      font-size: 17px;
      line-height: 1.5;
      color: var(--ink-soft);
    }
    .games { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
    .game {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 18px;
      align-items: center;
      padding: 16px;
      border: 1px solid var(--btn-border);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    .game:active { transform: scale(0.98); }
    .game img { width: 88px; height: 88px; border-radius: 20px; }
    .game-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: 0.14em; }
    .game-sub { margin: 2px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
    .game-text { margin: 0; font-size: 15px; line-height: 1.45; }
    .home-foot { margin-top: 34px; font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
    .home-foot a { color: inherit; }
  </style>
</head>
<body>
  <main class="home">
    <h1 class="home-brand">MIND PAUSE</h1>
    <p class="home-tagline" id="tagline"></p>
    <ul class="games" id="games"></ul>
    <p class="home-foot" id="foot"></p>
  </main>
  <script type="module">
    const de = (navigator.languages?.[0] || navigator.language || 'en').toLowerCase().startsWith('de');
    const lang = de ? 'de' : 'en';
    const text = {
      de: {
        tagline: 'Ruhige, sorgfältig gestaltete Denkspiele für iPhone und iPad. Klassische Brettspiele, neu gedacht. Kostenlos, offline, ohne Werbung.',
        foot: 'Tipp: Öffne ein Spiel in Safari und wähle „Teilen“ und „Zum Home-Bildschirm“. Dann startet es wie eine App, auch ohne Internet.',
      },
      en: {
        tagline: 'Calm, beautifully crafted puzzle games for iPhone and iPad. Classic board games, reimagined. Free, offline, no ads.',
        foot: 'Tip: open a game in Safari and choose “Share” and “Add to Home Screen”. It then starts like an app, even without internet.',
      },
    }[lang];
    document.documentElement.lang = lang;
    document.getElementById('tagline').textContent = text.tagline;
    document.getElementById('foot').textContent = text.foot;
    const games = await (await fetch('games.json', { cache: 'no-cache' })).json();
    document.getElementById('games').innerHTML = games.map((g) => `
      <li>
        <a class="game" href="${g.id}/">
          <img src="${g.icon}" alt="">
          <div>
            <h2 class="game-title">${g.title}</h2>
            <p class="game-sub">${g.subtitle[lang]}</p>
            <p class="game-text">${g.description[lang]}</p>
          </div>
        </a>
      </li>`).join('');
  </script>
</body>
</html>
