# MIND PAUSE als statische Seite.
#
# Die Sammlung hat keinen Build-Schritt: index.html, games.json, shared/ und die
# Spielordner werden unverändert ausgeliefert. Alle Verweise im Projekt sind
# relativ, die Seite läuft deshalb sowohl auf einer eigenen Domain als auch in
# einem Unterordner.
#
# Wichtig für die Spiele als App auf dem Home-Bildschirm:
#   * sw.js und index.html dürfen nie aus dem Cache kommen, sonst bleibt ein
#     Gerät auf einer alten Version stehen.
#   * manifest.webmanifest braucht den Typ application/manifest+json, den
#     nginx von sich aus nicht kennt.
#   * Dateien mit Version im Verweis (?v= oder ?shell=) dürfen lange liegen
#     bleiben, denn nach einem Update heißt der Verweis anders.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

    # /spring wird zu /spring/, ohne den internen Hostnamen des Containers
    absolute_redirect off;
    autoindex off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Zum Prüfen durch Coolify
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Service Worker jedes Spiels: immer frisch prüfen. Muss vor der Regel für
    # .js stehen, denn die erste passende Regel gewinnt.
    location ~ /sw\.js$ {
        expires epoch;
    }

    location ~ \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        expires epoch;
    }

    # Dateien der Spiele und der Hülle, immer mit Version im Verweis
    location ~* \.(?:css|js|mjs)$ {
        expires 1y;
    }

    # Symbole und Bilder
    location ~* \.(?:svg|png|jpe?g|webp|ico|woff2?)$ {
        expires 7d;
    }

    # Startseite, Spielseiten und games.json: immer frisch prüfen
    location / {
        try_files $uri $uri/ =404;
        expires epoch;
    }
}
